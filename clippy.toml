allow-unwrap-in-tests = true
doc-valid-idents = [
  "WebTransport",
  "WebSocket",
  "WebSockets",
  "LibreWolf",
  "MacOS",
  "WiFi",
  "..",
]

disallowed-methods = [
  { path = "core::option::Option::map_or", reason = "prefer `.map(...).unwrap_or(...)` for clarity" },
]

# These operators are implemented using wrapping sequence arithmetic or
# field-wise saturating counters. Keep the exceptions limited to matching types.
arithmetic-side-effects-allowed-binary = [
  ["packet::Seq", "packet::Seq"],
  ["packet::MessageSeq", "packet::MessageSeq"],
  ["packet::PacketSeq", "packet::PacketSeq"],
  ["MessageStats", "MessageStats"],
  ["aeronet_io::packet::PacketStats", "aeronet_io::packet::PacketStats"],
]
