[package]
name = "aeronet_iroh"
version = "0.21.0"
edition.workspace = true
rust-version.workspace = true
description = "Iroh IO layer implementation for `aeronet`"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg=docsrs_aeronet"]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[[example]]
name = "iroh_peer"
path = "examples/iroh_peer.rs"

[dependencies]
aeronet_io = { workspace = true }
aeronet_tokio_runtime = { workspace = true }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_platform = { workspace = true }
bytes = { workspace = true }
derive_more = { workspace = true, features = ["display", "error"] }
futures = { workspace = true }
iroh = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bevy = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true
