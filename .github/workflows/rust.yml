on:
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - "Cargo.*"
      - "crates/**"
      - "examples/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rust.yml"
      - "Cargo.*"
      - "crates/**"
      - "examples/**"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2
        with:
          components: rustfmt
      - run: cargo +nightly fmt --check

  shear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: cargo-bins/cargo-binstall@f21464c976f072485f2ab0743b3337b66911d97f
      - run: cargo binstall --no-confirm cargo-shear
      - run: cargo shear

  clippy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy
      - uses: ./.github/actions/install-bevy-deps
      - run: cargo clippy --target '${{ matrix.target }}' --workspace --all-features --all-targets -- -Dwarnings

  doc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
        include:
          - target: "wasm32-unknown-unknown"
            docflags: '--cfg=getrandom_backend="wasm_js"'
    env:
      RUSTDOCFLAGS: "-Dwarnings --cfg=docsrs_aeronet --cfg=web_sys_unstable_apis ${{ matrix.docflags }}"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2
        with:
          targets: "wasm32-unknown-unknown"
      - uses: ./.github/actions/install-bevy-deps
      - run: cargo +nightly doc --target '${{ matrix.target }}' --workspace --all-features

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: ./.github/actions/install-bevy-deps
      - run: cargo check --target '${{ matrix.target }}' --workspace --all-features --all-targets
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo check --package aeronet_websocket --no-default-features --features client --lib
          cargo check --package aeronet_websocket --no-default-features --features server --lib
          cargo check --package aeronet_websocket --no-default-features --features server,self-signed --example websocket_server
          cargo test --package aeronet_websocket --no-default-features --features client,server,self-signed,rustls/ring --test connection
          cargo test --package aeronet_websocket --features client,server,rustls/ring --test crypto_provider

  check-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2
      - uses: ./.github/actions/install-bevy-deps
      - run: cargo install cargo-fuzz
      - run: cd crates/aeronet_transport && cargo +nightly fuzz check

  check-minimal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ["aeronet_io", "aeronet_transport", "aeronet_replicon"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: thumbv6m-none-eabi
      - uses: ./.github/actions/install-bevy-deps
      - run: cargo check --target thumbv6m-none-eabi --package '${{ matrix.package }}' --no-default-features --features bevy_ecs/critical-section

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # nextest always seems to run out of space when compiling with `--workspace`:
        # <https://github.com/aecsocket/aeronet/actions/runs/20119199477/job/57735517314>
        # so we'll run tests for individual crates
        # hopefully then we won't run out of space
        package:
          - "aeronet_io"
          - "aeronet_transport"
          - "aeronet_channel"
          # - "aeronet_steam" # has no tests
          - "aeronet_websocket"
          - "aeronet_webtransport"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: ./.github/actions/install-bevy-deps
      - uses: cargo-bins/cargo-binstall@f21464c976f072485f2ab0743b3337b66911d97f
      - run: cargo binstall --no-confirm cargo-nextest
      - run: cargo nextest run --package '${{ matrix.package }}' --all-features

  # `cargo nextest` currently doesn't support doctests: <https://nexte.st/#quick-start>
  test-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: ./.github/actions/install-bevy-deps
      - run: cargo test --doc --workspace --all-features
